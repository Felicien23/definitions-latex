# CI/CD for definitions-latex.  GitLab is the canonical repository; GitHub
# is a read-only mirror.  Maintainer guide: doc/RELEASING.md, doc/MIRRORING.md.
#
#   merge requests      lint, tests (TeX Live 2023 and current), package build
#   main                the same, then push main to the GitHub mirror(*)
#   tags vX.Y.Z[-pre]   the same, check the tag, then publish the GitLab
#                       release, push the tag to GitHub(*) and publish the
#                       matching GitHub release(*)
#
#   (*) only when the project CI/CD variable PUBLISH_TO_GITHUB is "true" and
#       the protected variable GITHUB_TOKEN is available (protected refs only).
#
# Nothing is published from merge requests, other branches or forks.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                     # the merge request pipeline covers it
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - publish

variables:
  # The GitHub mirror (owner/name).  Not secret; see doc/MIRRORING.md.
  GITHUB_REPOSITORY: "Felicien23/definitions-latex"
  # Default off.  Set PUBLISH_TO_GITHUB=true in Settings > CI/CD > Variables
  # once the mirror has been set up and the history audit is done.
  PUBLISH_TO_GITHUB: "false"

default:
  interruptible: true
  before_script:
    - unset GITHUB_TOKEN              # only the publishing jobs may use it

# --------------------------------------------------------------------- test
# Ubuntu 24.04 ships TeX Live 2023 ("TeX Live 2023/Debian"), the release the
# package is developed and tested on, and the one the rendering reference in
# tests/rendering/ was recorded with.  This job also builds the release files
# once; the publish jobs use exactly these files.
test-and-package:tl2023:
  stage: test
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_DEPTH: "0"                    # check-tag.sh needs the default branch history
  before_script:
    - unset GITHUB_TOKEN
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      make python3 zip unzip git ca-certificates latexmk chktex lmodern
      texlive-base texlive-latex-base texlive-latex-recommended
      texlive-latex-extra texlive-science texlive-fonts-extra texlive-xetex > /dev/null
  script:
    - pdflatex --version | head -n 1
    - make test
    - make dist
    - echo "VERSION=$(tools/version.sh)" > build/version.env
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        tools/ci/check-tag.sh
        tools/release-notes.sh "$(tools/version.sh)" > build/release-notes-gitlab.md
        tools/release-notes.sh "$(tools/version.sh)" "$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG" > build/release-notes-github.md
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/
      - build/
    reports:
      dotenv: build/version.env

# Current TeX Live: catches incompatibilities with newer packages.  The
# rendering comparison is skipped here (its reference is for TeX Live 2023).
test:texlive-latest:
  stage: test
  image: texlive/texlive:latest
  before_script:
    - unset GITHUB_TOKEN
    - command -v make python3 > /dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends make python3 > /dev/null; }
  script:
    - pdflatex --version | head -n 1
    - make test
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - build/

# ------------------------------------------------------------------ publish
.release-tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/

.github-publishing:
  interruptible: false
  resource_group: github-mirror      # one push to GitHub at a time
  before_script: []                  # keeps GITHUB_TOKEN

release:gitlab-files:
  stage: publish
  extends: .release-tag-only
  interruptible: false
  image: alpine:3.20
  needs: [test-and-package:tl2023, test:texlive-latest]
  script:
    - apk add --no-cache curl > /dev/null
    - tools/ci/upload-gitlab-packages.sh

release:gitlab:
  stage: publish
  extends: .release-tag-only
  interruptible: false
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [test-and-package:tl2023, release:gitlab-files]
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG (version $VERSION)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: definitions-latex $VERSION
    description: build/release-notes-gitlab.md
    assets:
      links:
        - name: definitions-latex-$VERSION.zip
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/definitions-latex/$VERSION/definitions-latex-$VERSION.zip
          link_type: package
          direct_asset_path: /definitions-latex-$VERSION.zip
        - name: definitions-doc-$VERSION.pdf
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/definitions-latex/$VERSION/definitions-doc-$VERSION.pdf
          link_type: other
          direct_asset_path: /definitions-doc-$VERSION.pdf
        - name: SHA256SUMS
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/definitions-latex/$VERSION/SHA256SUMS
          link_type: other
          direct_asset_path: /SHA256SUMS

mirror:github:
  stage: publish
  extends: .github-publishing
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"                    # a shallow clone cannot be pushed
  needs: [test-and-package:tl2023, test:texlive-latest]
  rules:
    - if: $PUBLISH_TO_GITHUB != "true" || $GITHUB_TOKEN == null
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
  script:
    - apk add --no-cache git > /dev/null
    - tools/ci/mirror-github.sh

release:github:
  stage: publish
  extends: .github-publishing
  image: alpine:3.20
  needs: [test-and-package:tl2023, release:gitlab, mirror:github]
  rules:
    - if: $PUBLISH_TO_GITHUB != "true" || $GITHUB_TOKEN == null
      when: never
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
  script:
    - apk add --no-cache github-cli curl > /dev/null
    - tools/ci/publish-github.sh
